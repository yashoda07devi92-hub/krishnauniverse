name: Krishna Universe Auto Reel
# Schedule re-registered: 2026-06-21

on:
  schedule:
    # ---------------------------------------------------------------------
    # 5 reels/day, spread across THREE US audience windows instead of stacking
    # all of them into the evening:
    #
    #   3 reels - EVENING PRIME  (7:00 PM - 1:30 AM ET)  <- the main window
    #   1 reel  - MORNING SCROLL (6:00 AM - 9:00 AM ET)
    #   1 reel  - AFTER SCHOOL   (3:00 PM - 5:00 PM ET)
    #
    # WHY NOT ALL FIVE IN THE EVENING: on a channel this size every upload is
    # tested against roughly the same small slice of subscribers. Five uploads
    # inside one five-hour block means video 2 enters the feed while video 1 is
    # still being tested, so they compete with each other instead of with the
    # rest of YouTube. Splitting the day gives each upload its own audience.
    #
    # THIS CHANNEL TARGETS INDIA (IST), NOT THE US.
    # Devotional viewing in India has two genuine peaks rather than one: the
    # morning puja window (roughly 6-8 AM) and the evening from sandhya aarti
    # through late night. The slots below cover both, plus a lunch slot.
    #
    # FOUR THINGS THESE TIMES ACCOUNT FOR
    #
    # 1) CRON TIME IS NOT PUBLISH TIME. THE LEAD IS ~80 MINUTES, MEASURED.
    #    A GitHub Actions schedule is queued, not guaranteed. This figure is not
    #    a guess - it was measured against five consecutive scheduled runs on
    #    the sibling repo this pipeline came from:
    #
    #        cron 14:43 UTC -> started 16:06   (+83 min)
    #        cron 17:29 UTC -> started 18:57   (+88 min)
    #        cron 21:11 UTC -> started 22:15   (+64 min)
    #        cron 23:53 UTC -> started 01:12   (+79 min)
    #        cron 23:53 UTC -> started 01:11   (+78 min)
    #                                  average  +78 min
    #
    #    Those runs completed in 4-6 minutes, so essentially all of the lead is
    #    queue time, not render time. Every cron below is set 80 MINUTES before
    #    its intended publish time. Do NOT "tidy" these into round numbers, and
    #    do not shorten the lead without re-measuring with
    #    `python slot_report.py --shorts-only`, which reads the real publish hour
    #    off YouTube instead of guessing.
    #
    # 2) IST HAS NO DAYLIGHT SAVING - THIS IS SIMPLER THAN THE US CASE.
    #    India stays on UTC+5:30 all year, so unlike the US schedule this
    #    pipeline was ported from, these crons NEVER need a seasonal correction.
    #    cron UTC = IST - 5:30 - 1:20 lead:
    #        00:25 UTC -> 07:15 IST     12:25 UTC -> 19:15 IST
    #        06:40 UTC -> 13:30 IST     14:25 UTC -> 21:15 IST
    #                                   15:55 UTC -> 22:45 IST
    #
    # 3) SCHEDULED RUNS ARE SOMETIMES DROPPED ENTIRELY.
    #    A run on the sibling repo failed with "The job was not acquired by
    #    Runner of type hosted even after multiple attempts" plus a GitHub
    #    internal server error - no runner was ever assigned, so no code change
    #    could have prevented it. It costs one reel; there is nothing to fix.
    #    Minute values below avoid :00 and :30, when the scheduler is most
    #    congested and both delays and dropped runs are worst.
    #
    # 4) THE YOUTUBE API QUOTA, NOT GITHUB MINUTES.
    #    Actions minutes are unlimited on a public repo, but the YouTube Data
    #    API still allows 10,000 units/day and videos.insert costs 1,600 - a hard
    #    ceiling of 6 uploads per day.
    #
    #    The quota resets at midnight PACIFIC (07:00 UTC), NOT at UTC midnight.
    #    That boundary falls between two of these crons, which is easy to get
    #    wrong: 00:25 and 06:40 UTC land BEFORE 07:00, so they belong to the
    #    PREVIOUS quota day. Each quota day therefore contains:
    #        12:25, 14:25, 15:55 (day D) + 00:25, 06:40 (day D+1) = 5 reels
    #        5 x 1,650 = 8,250 units, leaving room for a retry.
    #
    #    The 12:25 slot is skipped on long-form days (Mon/Wed/Fri) for two
    #    reasons: it would push that quota day to 9,900 units with no retry
    #    margin, and it publishes at 19:15 IST - only ~75 minutes before the
    #    long-form video at 20:30 IST - so the two would split the same audience.
    #    Weekly totals: 32 reels + 3 long-form.
    # ---------------------------------------------------------------------
    # --- MORNING PUJA (6:00 - 8:00 AM IST) ---
    - cron: "25 0 * * *"         # -> ~07:15 IST
    # --- LUNCH ---
    - cron: "40 6 * * *"         # -> ~13:30 IST
    # --- SANDHYA AARTI (skipped Mon/Wed/Fri - see quota note above) ---
    - cron: "25 12 * * 0,2,4,6"  # -> ~19:15 IST
    # --- NIGHT PEAK (the strongest window for YouTube India) ---
    - cron: "25 14 * * *"        # -> ~21:15 IST
    # --- LATE NIGHT (bed scroll) ---
    - cron: "55 15 * * *"        # -> ~22:45 IST
  workflow_dispatch:
    inputs:
      diagnose_only:
        description: "Only check secrets/sources, do NOT make a video (true/false)"
        required: false
        default: "false"
      selftest:
        description: "Build a real reel but DO NOT upload; print a quality report (true/false)"
        required: false
        default: "false"
      days:
        description: "Number of days to generate for"
        required: false
        default: "1"
      per_day:
        description: "Reels per day"
        required: false
        default: "1"
      upload_youtube:
        description: "Upload generated reels to YouTube"
        required: false
        default: "true"
      upload_instagram:
        description: "Upload to Instagram (risky, off by default)"
        required: false
        default: "false"

concurrency:
  group: krishna-auto-reel
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      # contents: write (was read) so the no-repeat rotation state in
      # history.json can be pushed back. Without this every run starts from a
      # blank history and the whole no-repeat guarantee is lost.
      contents: write
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean up old artifacts (free Actions storage)
        # Reels are already published to YouTube, so old artifacts are just
        # dead weight that fills the 0.5 GB free quota. Delete them every run
        # so storage never fills up again.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Deleting old workflow artifacts to free storage..."
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts" \
            -q '.artifacts[].id' | while read -r id; do
              [ -n "$id" ] && gh api -X DELETE \
                "repos/${{ github.repository }}/actions/artifacts/$id" \
                && echo "deleted artifact $id" || true
            done
          echo "Artifact cleanup done."

      - name: Delete workflow runs older than 2 days
        # Artifacts are already cleaned above; this clears the RUN HISTORY, which
        # otherwise grows by ~150 entries a month and makes the Actions tab
        # unusable for finding a real failure.
        #
        # Retention is 2 DAYS on purpose (owner's call): a scheduled reel either
        # published or it did not, and that is visible on YouTube within minutes,
        # so there is nothing to debug in a run from last week. Only `completed`
        # runs are eligible, so an in-progress build is never deleted.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUTOFF=$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Deleting completed workflow runs created before $CUTOFF"
          DELETED=0
          # Oldest first so a capped page still removes the most useful ones.
          for id in $(gh api --paginate \
                "repos/${{ github.repository }}/actions/runs?per_page=100&status=completed" \
                -q ".workflow_runs[] | select(.created_at < \"$CUTOFF\") | .id" \
                | head -200); do
            if gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" >/dev/null 2>&1; then
              DELETED=$((DELETED+1))
            fi
          done
          echo "Deleted $DELETED old workflow run(s)."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Secret/source diagnostic (NO video)
        if: ${{ github.event.inputs.diagnose_only == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.3 google-generativeai==0.8.3 python-dotenv==1.0.1
          python diagnose.py

      - name: Install system dependencies
        if: ${{ github.event.inputs.diagnose_only != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core fontconfig

          # DEVANAGARI FONT. Without one, every Hindi word on screen renders as an
          # empty box - and nothing raises an error, so a broken reel would be
          # published as a "success".
          #
          # Package names are NOT reliable here. An earlier version of this step
          # installed `fonts-noto-devanagari`, which does not exist as an Ubuntu
          # package, and the whole run died with exit code 100. Which package
          # actually ships Noto's Devanagari faces (fonts-noto-core,
          # fonts-noto-extra, fonts-indic, ...) also moves between releases.
          #
          # So: try several candidates INDIVIDUALLY, each allowed to fail, then
          # verify by asking fontconfig what is actually installed. If none of
          # them provided a Hindi font, download Noto Sans Devanagari directly -
          # that removes the dependency on package naming entirely.
          for pkg in fonts-noto-core fonts-indic fonts-lohit-deva \
                     fonts-samyak-deva fonts-deva fonts-noto-extra ; do
            sudo apt-get install -y "$pkg" 2>/dev/null \
              && echo "installed: $pkg" \
              || echo "not available on this release, skipping: $pkg"
          done

          if ! fc-list ":lang=hi" 2>/dev/null | grep -q . ; then
            echo "No Hindi-capable font from apt - fetching Noto Sans Devanagari directly."
            sudo mkdir -p /usr/share/fonts/truetype/krishna
            for url in \
              "https://github.com/notofonts/notofonts.github.io/raw/main/fonts/NotoSansDevanagari/hinted/ttf/NotoSansDevanagari-Bold.ttf" \
              "https://github.com/google/fonts/raw/main/ofl/notosansdevanagari/NotoSansDevanagari%5Bwdth,wght%5D.ttf" ; do
              if sudo curl -fsSL --retry 3 --max-time 60 -o \
                   /usr/share/fonts/truetype/krishna/NotoSansDevanagari-Bold.ttf "$url" ; then
                echo "downloaded from: $url"
                break
              fi
            done
            sudo fc-cache -f >/dev/null 2>&1 || true
          fi
          POLICY="/etc/ImageMagick-6/policy.xml"
          if [ -f "$POLICY" ]; then
            sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' "$POLICY" || true
            sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"\/>//' "$POLICY" || true
          fi

      - name: Verify a Devanagari font is installed
        if: ${{ github.event.inputs.diagnose_only != 'true' }}
        run: |
          # HARD FAILURE on purpose. Every other missing dependency in this
          # pipeline degrades gracefully, but a missing Devanagari font does not:
          # Pillow silently substitutes blank glyphs, so the run would "succeed"
          # and publish a Hindi reel whose on-screen text and thumbnail caption
          # are rows of empty boxes. Better to stop here than upload that.
          #
          # The check asks FONTCONFIG rather than testing hard-coded paths, so it
          # cannot be defeated by a distro moving the install location.
          echo "Hindi-capable fonts fontconfig can see:"
          fc-list ":lang=hi" family file 2>/dev/null | head -20 || true
          if ! fc-list ":lang=hi" 2>/dev/null | grep -q . ; then
            echo "::error::No Devanagari font on this runner. Hindi text would render as empty boxes."
            echo "Tried: fonts-noto-core, fonts-indic, fonts-lohit-deva, fonts-samyak-deva,"
            echo "fonts-deva, fonts-noto-extra, and a direct download. All failed."
            exit 1
          fi
          echo "fontconfig reports a Hindi font is present."

      - name: Prepare background music
        if: ${{ github.event.inputs.diagnose_only != 'true' }}
        run: |
          mkdir -p assets/music
          # WHY THERE ARE NO DOWNLOADS HERE ANY MORE
          #
          # This step used to pull nine hard-coded Pixabay tracks named
          # 01_happy_ukulele, 02_uplifting_pop, 07_kids_joy and so on. Those were
          # chosen for a cute-pets channel. Under a Hindi Krishna katha they are
          # actively wrong - a cheerful ukulele loop under the story of Gandhari's
          # curse is the kind of mismatch a viewer feels in the first two seconds.
          #
          # They are not replaced with "devotional" URLs because a hard-coded CDN
          # link cannot be verified from here, and a link that silently starts
          # serving the wrong track (or a 404 HTML page) is worse than no link.
          # Instead the pipeline falls back to modules/video_composer's
          # _synth_background_music, which was rewritten to generate a tanpura
          # drone with a slow bansuri line in a pentatonic raga - correct for this
          # niche and impossible to get a copyright claim on.
          #
          # TO USE REAL MUSIC: commit your own royalty-free devotional tracks
          # (bansuri / sitar / tanpura, instrumental only) into assets/music/ as
          # .mp3. .gitignore already allows assets/music/*.mp3. Anything found
          # there overrides the synth automatically - see _find_music_track().
          COUNT=$(ls -1 assets/music/*.mp3 2>/dev/null | wc -l)
          echo "Real music tracks found in assets/music: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "No .mp3 tracks committed -> using the synthesized devotional drone."
          else
            ls -la assets/music/*.mp3
          fi

      - name: Install Python dependencies
        if: ${{ github.event.inputs.diagnose_only != 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine run parameters
        if: ${{ github.event.inputs.diagnose_only != 'true' }}
        id: params
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "days=1" >> "$GITHUB_OUTPUT"
            echo "per_day=1" >> "$GITHUB_OUTPUT"
          else
            echo "days=${{ github.event.inputs.days }}" >> "$GITHUB_OUTPUT"
            echo "per_day=${{ github.event.inputs.per_day }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate reel(s)
        if: ${{ github.event.inputs.diagnose_only != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python generate.py --days "${{ steps.params.outputs.days }}" --per-day "${{ steps.params.outputs.per_day }}"

      - name: Selftest quality report (NO upload)
        if: ${{ always() && github.event.inputs.selftest == 'true' }}
        run: |
          echo "================= SELFTEST QUALITY REPORT ================="
          ls -la output/ || true
          cat manifest.json || true
          for f in output/*.mp4; do
            [ -f "$f" ] || continue
            echo ">>> $f"
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=width,height,codec_name,bit_rate,avg_frame_rate \
              -show_entries format=duration,size,bit_rate \
              -of default=noprint_wrappers=1 "$f" || true
          done
          echo "=========================================================="
          exit 1

      - name: Upload to YouTube
        if: ${{ github.event.inputs.diagnose_only != 'true' && github.event.inputs.selftest != 'true' && (github.event_name == 'schedule' || github.event.inputs.upload_youtube == 'true') }}
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          python upload_youtube.py --limit "${{ steps.params.outputs.per_day }}" --privacy public

      - name: Upload to Instagram (optional)
        if: ${{ github.event.inputs.diagnose_only != 'true' && github.event.inputs.selftest != 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.upload_instagram == 'true' }}
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
        run: |
          python upload_instagram.py --limit "${{ steps.params.outputs.per_day }}"

      - name: Save no-repeat history back to the repo
        # WHY: modules/history.py guarantees that a story topic, spoken hook,
        # screen hook, flash phrase, narrator voice or title pattern is never
        # reused until its pool is exhausted. That guarantee lives in
        # history.json, and every Actions run gets a fresh checkout - so unless
        # the file is pushed back, each run starts from an empty history and
        # repeats come straight back.
        #
        # Runs on always() so the rotation is still recorded when the upload step
        # failed: the reel was generated either way, and re-serving that topic
        # would be worse than losing it.
        #
        # continue-on-error because a git conflict must never be reported as a
        # failed video. The reel is already on YouTube by this point.
        if: ${{ always() && github.event.inputs.diagnose_only != 'true' && github.event.inputs.selftest != 'true' }}
        continue-on-error: true
        run: |
          set -u
          if [ ! -f history.json ]; then
            echo "No history.json produced; nothing to save."
            exit 0
          fi
          git add history.json
          if git diff --cached --quiet -- history.json; then
            echo "history.json unchanged; nothing to commit."
            exit 0
          fi
          # -c rather than `git config` so no persistent config is written.
          git -c user.name="krishna-bot" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "chore: record content rotation history [skip ci]"
          # Concurrent runs (a reel and the long-form job) can race. Rebase and
          # retry rather than clobbering the other pipeline's history file.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "history.json pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; rebasing onto the remote (attempt $attempt)."
            git pull --rebase --autostash || true
          done
          echo "Could not push history.json after 5 attempts; the next run will retry."

      - name: Upload artifacts (manual/debug runs only)
        # Scheduled daily reels already publish to YouTube, so we DON'T keep
        # any artifacts for them — this stops GitHub Actions storage from
        # filling up (free quota is only 0.5 GB). Artifacts are kept only for
        # manual debug runs, and auto-deleted after 1 day.
        if: ${{ always() && github.event.inputs.diagnose_only != 'true' && github.event_name != 'schedule' }}
        # Never fail the whole run if storage is momentarily full: GitHub
        # recalculates the storage quota only every 6-12 hours, so right after
        # the cleanup step the quota can still read "full" and block the upload.
        # The reel is already on YouTube, so this backup is optional.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: krishna-reels
          path: |
            output/*.mp4
            manifest.json
          if-no-files-found: ignore
          retention-days: 1
