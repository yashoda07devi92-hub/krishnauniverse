name: Diagnose Secrets

# Fast health check (NO video render, ~30s). Run this manually to confirm
# whether PEXELS_API_KEY / GEMINI_API_KEY / YouTube secrets actually work
# BEFORE spending ~15 min on a full reel. Read the result in the run log.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install light dependencies (no moviepy)
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.3 google-generativeai==0.8.3 python-dotenv==1.0.1

      - name: Run diagnostic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          python diagnose.py
