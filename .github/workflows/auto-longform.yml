name: Sweet Soul Auto Longform (3-5 min stories)

# ONE long-form (3-5 min) story, posted roughly EVERY OTHER DAY at US evening
# prime time. The cadence is no longer limited by GitHub Actions minutes - the
# repo is public, so those are unlimited - it is limited by the YouTube Data API
# quota of 10,000 units/day against 1,600 units per upload.
#
# SCHEDULE: cron "41 22 * * 1,3,5" = 22:41 UTC every Mon/Wed/Fri
#     publishes ~8:39 PM US Eastern in summer, ~7:39 PM in winter
#     -> inside the 7:00 PM - 1:30 AM US evening prime-time window all year
#     = 4:11 AM IST
#
# WHY DAY-OF-WEEK INSTEAD OF THE OLD "*/2" (every 2nd day-of-month):
#   "*/2" on day-of-month resets at every month boundary, so the 31st and the
#   1st both match and the job runs on two CONSECUTIVE days ~7 times a year.
#   Mon/Wed/Fri is predictable, keeps the "roughly every other day" cadence,
#   and lets the reel workflow reliably skip its 23:27 slot on exactly these
#   days to stay inside the YouTube API quota (see auto-reel.yml for the math).
#
# WHY 22:41 AND NOT THE PUBLISH TIME ITSELF:
#   The Actions scheduler queues jobs, and the delay is far larger than it looks.
#   Measured over five consecutive scheduled runs on this repo it averaged
#   +78 MINUTES (range +64 to +88). On top of that this build renders a 3-5
#   minute video with AI scene images, so the total lead is set to ~118 minutes.
#   Verify with `python slot_report.py --longform-only`, which reads the real
#   publish time off YouTube instead of guessing. Do not shorten this lead
#   without re-measuring.
#
# This workflow lives entirely under the longform/ folder and does NOT touch the
# Krishna Universe reel pipeline or its schedule.

on:
  schedule:
    - cron: "41 22 * * 1,3,5"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = real build + upload (default) | preview = real build, no upload | test = fast 1-min build, no upload"
        required: false
        default: "full"
      upload_youtube:
        description: "Upload to YouTube (only applies in full mode)"
        required: false
        default: "true"

concurrency:
  group: krishna-auto-longform
  cancel-in-progress: false

defaults:
  run:
    working-directory: longform

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: write
      # contents: write (was read) so longform/history.json - the no-repeat
      # rotation state for topic seeds and sign-offs - can be pushed back.
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean up old artifacts (free Actions storage)
        # Long-form videos are published to YouTube, so old artifacts just fill
        # the 0.5 GB free quota. Delete them every run so storage never fills.
        working-directory: .
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Deleting old workflow artifacts to free storage..."
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts" \
            -q '.artifacts[].id' | while read -r id; do
              [ -n "$id" ] && gh api -X DELETE \
                "repos/${{ github.repository }}/actions/artifacts/$id" \
                && echo "deleted artifact $id" || true
            done
          echo "Artifact cleanup done."

      - name: Set up Python (with pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: longform/requirements.txt

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: longform-apt-${{ runner.os }}-v1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core
          POLICY="/etc/ImageMagick-6/policy.xml"
          if [ -f "$POLICY" ]; then
            sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' "$POLICY" || true
            sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"\/>//' "$POLICY" || true
          fi

      - name: Download royalty-free music tracks (soft, calm)
        run: |
          mkdir -p assets/music
          dl() {
            curl -fsSL --max-time 30 -o "assets/music/$1" "$2" 2>/dev/null || { rm -f "assets/music/$1"; echo "SKIP $1"; return 1; }
            [ "$(stat -c%s "assets/music/$1" 2>/dev/null || echo 0)" -gt 10000 ] && echo "OK $1" || { rm -f "assets/music/$1"; echo "SKIP $1"; }
          }
          dl "01_calm_piano.mp3"     "https://cdn.pixabay.com/download/audio/2021/08/08/audio_dc39bde6cf.mp3" || true
          dl "02_gentle_ambient.mp3" "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3" || true
          dl "03_soft_strings.mp3"   "https://cdn.pixabay.com/download/audio/2022/10/30/audio_c8f4bb65b0.mp3" || true
          dl "04_warm_piano.mp3"     "https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0c6ff1bda.mp3" || true
          dl "05_uplifting.mp3"      "https://cdn.pixabay.com/download/audio/2022/03/24/audio_2cba25c436.mp3" || true
          dl "06_sunny.mp3"          "https://cdn.pixabay.com/download/audio/2023/02/28/audio_bb6f9a5552.mp3" || true
          dl "07_cheerful.mp3"       "https://cdn.pixabay.com/download/audio/2022/08/31/audio_1c9e73e5cf.mp3" || true
          dl "08_emotional.mp3"      "https://cdn.pixabay.com/download/audio/2023/01/16/audio_8b576799c1.mp3" || true
          dl "09_heartfelt.mp3"      "https://cdn.pixabay.com/download/audio/2022/11/22/audio_febc508520.mp3" || true
          ls -la assets/music/ || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate (TEST = fast 1-min build, no upload)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'test' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TTS_VOICE: ${{ secrets.TTS_VOICE }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
        run: |
          python generate.py --test
          echo "TEST build complete. Download the artifact below to review the look."

      - name: Generate (FULL real 5-7 min story — schedule, preview or full)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'full' || github.event.inputs.mode == 'preview')) }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TTS_VOICE: ${{ secrets.TTS_VOICE }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
        run: |
          python generate.py --count 1
          echo "Build complete. If this was 'preview', download the artifact below to watch the REAL video before it ever goes to YouTube."

      - name: Upload to YouTube (FULL mode / scheduled only — NOT preview/test)
        if: ${{ (github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full' && github.event.inputs.upload_youtube != 'false') }}
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          python upload_youtube.py

      - name: Save no-repeat history back to the repo
        # See the equivalent step in auto-reel.yml. This pipeline keeps its own
        # file (longform/history.json) so the two never fight over one path.
        # Skipped for test/preview builds, which are not real published episodes.
        if: ${{ always() && github.event.inputs.mode != 'test' && github.event.inputs.mode != 'preview' }}
        continue-on-error: true
        working-directory: .
        run: |
          set -u
          if [ ! -f longform/history.json ]; then
            echo "No longform/history.json produced; nothing to save."
            exit 0
          fi
          git add longform/history.json
          if git diff --cached --quiet -- longform/history.json; then
            echo "longform/history.json unchanged; nothing to commit."
            exit 0
          fi
          git -c user.name="krishna-bot" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "chore: record long-form rotation history [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "longform/history.json pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; rebasing onto the remote (attempt $attempt)."
            git pull --rebase --autostash || true
          done
          echo "Could not push after 5 attempts; the next run will retry."

      - name: Upload video artifact (preview/test review only)
        # Scheduled full runs publish to YouTube, so we don't keep artifacts for
        # them. Only manual preview/test runs keep one, auto-deleted after 1 day.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        # Never fail the whole run if storage is momentarily full: GitHub
        # recalculates the storage quota only every 6-12 hours, so right after
        # the cleanup step the quota can still read "full" and block the upload.
        # The video is already on YouTube, so this backup is optional.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: krishna-output
          path: |
            longform/output/*.mp4
            longform/output/*.jpg
          retention-days: 1
          if-no-files-found: ignore
